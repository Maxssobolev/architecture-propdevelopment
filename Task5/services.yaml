---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-end-app
  namespace: app-demo
  labels:
    app: front-end-app
    role: front-end
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front-end-app
  template:
    metadata:
      labels:
        app: front-end-app
        role: front-end
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: front-end-app
  namespace: app-demo
  labels:
    app: front-end-app
    role: front-end
spec:
  type: ClusterIP
  selector:
    app: front-end-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

